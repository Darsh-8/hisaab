<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F2; --surface:#FFFFFF; --sunk:#E9EBE8; --ink:#15171A; --ink2:#3A3E43; --muted:#72777D; --faint:#B4B8BB; --rule:#E1E3E0;
  --in:#23845A; --lend:#B06F0E; --danger:#B3261E;
  --r-lg:20px; --r-md:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1011; --surface:#171A1C; --sunk:#1E2224; --ink:#EDEEEC; --ink2:#C9CCCB; --muted:#8B9195; --faint:#4E5458; --rule:#25292C;
    --in:#56CF94; --lend:#E2AE52; --danger:#F08A80;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;
     font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:32px 18px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:36px}
.brand{font-size:22px;font-weight:600;letter-spacing:-.03em;padding:0 10px}
.brand span{color:var(--muted);font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.nav svg{width:18px;height:18px;flex:none}
.rail-foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--muted)}

main{padding:32px 44px 80px;max-width:1080px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:36px}
.title{font-size:28px;font-weight:500;letter-spacing:-.025em;margin:0}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.period{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:3px}
.period .arrow{width:30px;height:30px;border:0;background:none;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.period .arrow:hover{background:var(--sunk);color:var(--ink)}
.period .arrow:disabled{opacity:.3;cursor:default;background:none}
.period .plabel{min-width:128px;text-align:center;font-weight:500;font-size:14px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 18px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:1px solid var(--rule);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink2)}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:13px;font-weight:500}
.link:hover{color:var(--ink)}

.tabbar{display:none}

/* ---------- Common blocks ---------- */
.sec{margin-top:48px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
.sec-head h2{font-size:15px;font-weight:500;margin:0}
.sec-head .meta{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:18px 0}
.empty-hero{padding:72px 0;text-align:left;max-width:440px}
.empty-hero h2{font-size:28px;font-weight:400;letter-spacing:-.02em;margin:0 0 8px}
.empty-hero p{color:var(--muted);margin:0 0 22px}
.err{padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--danger);color:var(--danger);margin-bottom:24px}
.loading{color:var(--muted);padding:60px 0}

/* ---------- Hero ---------- */
.hero-label{font-size:14px;color:var(--muted);margin-bottom:10px}
.hero-num{font-size:clamp(46px,8vw,76px);font-weight:300;letter-spacing:-.045em;line-height:1}
.hero-num .cur{font-size:.55em;vertical-align:.55em;margin-right:4px;color:var(--muted);letter-spacing:0}
.hero-num.pos{color:var(--in)}
.figs{display:flex;gap:40px;margin-top:26px;flex-wrap:wrap}
.fig .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.fig .v{font-size:22px;font-weight:400;letter-spacing:-.02em;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--ink)}
.dot.in{background:var(--in)} .dot.lend{background:var(--lend)}
.note{margin:22px 0 0;font-size:14px;color:var(--ink2)}

/* ---------- Charts ---------- */
.chart{position:relative}
.readout{font-size:13px;color:var(--muted);min-height:20px;margin-bottom:10px}
.readout b{color:var(--ink);font-weight:500}
.plot{position:relative;height:200px}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ylab{position:absolute;right:0;font-size:11px;color:var(--muted);transform:translateY(-110%)}
.guide{position:absolute;top:0;bottom:0;width:1px;background:var(--faint);pointer-events:none}
.pt{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--bg);transform:translate(-50%,-50%);pointer-events:none}
.xlabs{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:6px}
.legend i.dash{border-top:2px dashed var(--faint)}
.legend i.sq{width:8px;height:8px;border:0;border-radius:2px;background:var(--ink)}
.legend i.sq.in{background:var(--in)}

.mbars{display:flex;align-items:flex-end;gap:10px;height:200px;border-bottom:1px solid var(--rule)}
.mb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;cursor:default}
.mb-bars{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}
.mb-bars span{width:min(14px,40%);border-radius:4px 4px 1px 1px;min-height:0}
.mb-in{background:var(--in)} .mb-out{background:var(--ink)}
.mb.dim .mb-bars span{opacity:.35}
.mlabs{display:flex;gap:10px;margin-top:8px}
.mlabs span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:hidden}

.donut-wrap{display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.donut{position:relative;width:170px;height:170px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .c b{font-size:20px;font-weight:400;letter-spacing:-.02em}
.donut .c span{font-size:12px;color:var(--muted)}
.dlegend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px}
.dl{display:flex;align-items:center;gap:10px;font-size:14px}
.dl .sw{width:10px;height:10px;border-radius:3px;background:var(--ink);flex:none}
.dl .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .p{color:var(--muted);font-size:13px}

.wbars{display:flex;align-items:flex-end;gap:14px;height:130px}
.wb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px}
.wb span{width:100%;max-width:38px;border-radius:6px;background:var(--ink);opacity:.18}
.wb.top span{opacity:1}
.wb small{font-size:11px;color:var(--muted)}

/* ---------- Lists ---------- */
.hlist{display:flex;flex-direction:column;gap:16px}
.hi{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:0 12px}
.ico{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:15px;line-height:1}
.hi .n{font-size:14px;font-weight:500}
.hi .a{font-size:14px;text-align:right}
.hi .a small{display:block;color:var(--muted);font-size:12px}
.bar{grid-column:2/4;height:3px;background:var(--sunk);border-radius:2px;margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);border-radius:2px}

.tx{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 0}
.tx + .tx{border-top:1px solid var(--rule)}
.tx-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{display:flex;flex-wrap:wrap;gap:0 10px;font-size:12px;color:var(--muted)}
.tx-amt{font-size:15px;text-align:right;white-space:nowrap}
.tx-amt.in{color:var(--in)} .tx-amt.lend{color:var(--lend)}
.pill{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--ink2);margin-left:6px;vertical-align:1px}

.day{margin-top:28px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--ink)}
.day-h b{color:var(--ink);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat{padding:20px 20px 20px 0}
.stat + .stat{padding-left:20px;border-left:1px solid var(--rule)}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:300;letter-spacing:-.03em;margin-top:4px}
.stat .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:9px 16px}
.search::placeholder{color:var(--muted)}

.person{border-top:1px solid var(--rule)}
.person:last-child{border-bottom:1px solid var(--rule)}
.person-btn{width:100%;display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:center;background:none;border:0;padding:16px 0;text-align:left}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:500;font-size:14px}
.person .n{font-weight:500}
.person .s{font-size:12px;color:var(--muted)}
.progress{height:3px;background:var(--sunk);border-radius:2px;margin-top:8px;overflow:hidden;max-width:260px}
.progress span{display:block;height:100%;background:var(--in)}
.owe{font-size:18px;font-weight:400;text-align:right;letter-spacing:-.01em}
.owe.lend{color:var(--lend)}
.owe small{display:block;font-size:12px;color:var(--muted)}
.person-hist{padding:0 0 14px 52px}

/* ---------- Add sheet ---------- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:var(--r-lg);width:min(460px,100vw - 24px);max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,12,14,.45)}
.sheet{padding:24px;display:flex;flex-direction:column;gap:18px;overflow:auto;max-height:calc(100vh - 40px)}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h3{margin:0;font-size:18px;font-weight:500}
.x{width:32px;height:32px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.seg.full{display:flex}
.seg.full button{flex:1}
.flabel{font-size:13px;color:var(--muted);margin-bottom:8px;display:block}
.amt-in{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.amt-in span{font-size:28px;color:var(--muted);font-weight:300}
.amt-in input{border:0;background:none;font-size:40px;font-weight:300;letter-spacing:-.03em;width:100%;padding:0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-sm);padding:10px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ferr{color:var(--danger);font-size:13px;margin:0;min-height:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20}

/* ---------- Mobile ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  main{padding:20px 18px calc(96px + env(safe-area-inset-bottom))}
  .topbar{margin-bottom:28px}
  .title{font-size:24px}
  .controls{width:100%;justify-content:space-between}
  #periodCtl{flex-wrap:nowrap;gap:8px}
  .period .plabel{min-width:0;padding:0 4px;font-size:13px}
  .period .arrow{width:28px;height:28px}
  .seg button{padding:6px 10px}
  .topbar .primary{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;padding:13px 18px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .grid2{grid-template-columns:1fr;gap:0}
  .grid2 > * + *{margin-top:48px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){padding-left:0;border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--rule)}
  .figs{gap:26px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--rule);
          padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted)}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar svg{width:21px;height:21px}
  dialog{margin:auto auto 0;width:100vw;max-width:100vw;border-radius:var(--r-lg) var(--r-lg) 0 0}
  .sheet{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">hisaab<span>.</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="synced"></div>
  </aside>

  <main>
    <div class="topbar">
      <h1 class="title" id="title">Overview</h1>
      <div class="controls">
        <div id="periodCtl" class="controls">
          <div class="period">
            <button class="arrow" id="prev" type="button" aria-label="Previous period">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <span class="plabel" id="plabel"></span>
            <button class="arrow" id="next" type="button" aria-label="Next period">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
          <div class="seg" id="modeSeg" role="group" aria-label="Period length">
            <button type="button" data-m="month">Month</button>
            <button type="button" data-m="year">Year</button>
            <button type="button" data-m="all">All</button>
          </div>
        </div>
        <button class="primary" id="addBtn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add entry
        </button>
      </div>
    </div>
    <div id="err" class="err" role="alert" hidden></div>
    <div id="view"><p class="loading">Loading your entries…</p></div>
  </main>
</div>

<nav class="tabbar" id="tabbar"></nav>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet">
    <div class="sheet-h">
      <h3 id="sheetTitle">New entry</h3>
      <button class="x" type="button" id="closeSheet" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="seg full" id="kindSeg" role="group" aria-label="Entry type">
      <button type="button" data-k="spent">Spent</button>
      <button type="button" data-k="received">Received</button>
      <button type="button" data-k="lent">Lent</button>
      <button type="button" data-k="back">Got back</button>
    </div>
    <div>
      <label class="flabel" for="fAmt">Amount</label>
      <div class="amt-in"><span>₹</span><input id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0"></div>
    </div>
    <div id="fCatWrap"><span class="flabel">Category</span><div class="chips" id="fCats"></div></div>
    <div id="fPersonWrap" hidden>
      <label class="flabel" for="fPerson">Person</label>
      <input class="field" id="fPerson" list="people" autocomplete="off" placeholder="Name">
      <datalist id="people"></datalist>
    </div>
    <div><span class="flabel" id="fModeLabel">Paid with</span><div class="chips" id="fModes"></div></div>
    <div><label class="flabel" for="fNote">Note</label><input class="field" id="fNote" autocomplete="off" placeholder="Optional"></div>
    <div class="row2">
      <div><label class="flabel" for="fDate">Date</label><input class="field" type="date" id="fDate"></div>
      <div><label class="flabel" for="fTime">Time</label><input class="field" type="time" id="fTime"></div>
    </div>
    <p class="ferr" id="fErr" role="alert"></p>
    <button class="primary" id="fSave" type="button" style="justify-content:center;padding:13px">Save entry</button>
  </div>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
const KEY = <?!= JSON.stringify(key) ?>;

/* ================= Constants ================= */
const PAGES = [
  {id:'overview', name:'Overview', icon:'<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>'},
  {id:'analytics', name:'Analytics', icon:'<path d="M5 20V11M12 20V4M19 20v-6"/>'},
  {id:'lending', name:'Lending', icon:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>'},
  {id:'activity', name:'Activity', icon:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'}
];
const CATS_OUT = ['Food & Dining 🍔','Shopping 🛍️','Transportation 🚕','Entertainment 🎬','Rent & Bills 🏠','Groceries 🛒','Health & Medical 🏥','Recharge & Subscriptions 📱','Travel ✈️','Gifts 🎁','Education 📚','Transfer Out 🔁','Other 💰'];
const CATS_IN = ['Salary 💼','Transfer In 🔁','Refund ↩️','Other 💰'];
const MODES = ['UPI 📱','Cash 💵','Credit Card 💳','Debit Card 💳','Bank Transfer 🏦','Other 💰'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* ================= State ================= */
const today = new Date();
const S = {rows:[], loaded:false, page:'overview', mode:'month',
           anchor:new Date(today.getFullYear(), today.getMonth(), 1),
           filter:'all', q:'', open:new Set(), kind:'spent', cat:null, mode2:'UPI 📱'};

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('en-IN', {maximumFractionDigits:2});
const r2 = n => Math.round(n * 100) / 100;
const money = n => (n < 0 ? '−' : '') + '₹' + nf.format(Math.abs(r2(n)));
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + '₹' + nf.format(Math.abs(r2(n)));
function compact(n){
  const a = Math.abs(n), t = (v, s) => (v).toFixed(1).replace(/\.0$/, '') + s;
  return '₹' + (a >= 1e7 ? t(a/1e7,'Cr') : a >= 1e5 ? t(a/1e5,'L') : a >= 1e3 ? t(a/1e3,'k') : Math.round(a));
}
const PICTO = /[\p{Extended_Pictographic}\uFE0F\u200D\u20E3]/gu;
const clean = s => String(s || '').replace(PICTO, '').replace(/\s+/g, ' ').trim();
const iconOf = s => { const m = String(s || '').match(/\p{Extended_Pictographic}/u); return m ? m[0] : ''; };
const sum = a => a.reduce((s, r) => s + r.amount, 0);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const initials = s => clean(s).split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';

const isLent   = r => r.type === 'Debit'  && r.ckey.startsWith('lent');
const isRepaid = r => r.type === 'Credit' && r.ckey.startsWith('repaid');
const isSpend  = r => r.type === 'Debit'  && !isLent(r);
const isIncome = r => r.type === 'Credit' && !isRepaid(r);

function prep(r){
  r.cat = clean(r.category) || 'Uncategorised';
  r.ckey = r.cat.toLowerCase();
  r.icon = iconOf(r.category);
  r.modeName = clean(r.mode);
  return r;
}

/* ================= Periods ================= */
function range(mode = S.mode, a = S.anchor){
  const y = a.getFullYear(), m = a.getMonth();
  if (mode === 'month') return {start: iso(new Date(y, m, 1)), end: iso(new Date(y, m + 1, 0))};
  if (mode === 'year')  return {start: y + '-01-01', end: y + '-12-31'};
  const ds = S.rows.map(r => r.date).sort();
  return {start: ds[0] || iso(today), end: ds[ds.length - 1] || iso(today)};
}
function prevAnchor(){
  const a = S.anchor;
  return S.mode === 'month' ? new Date(a.getFullYear(), a.getMonth() - 1, 1) : new Date(a.getFullYear() - 1, 0, 1);
}
function label(mode = S.mode, a = S.anchor){
  if (mode === 'month') return MONTHS[a.getMonth()] + ' ' + a.getFullYear();
  if (mode === 'year') return String(a.getFullYear());
  return 'All time';
}
function shortLabel(mode = S.mode, a = S.anchor){
  if (mode === 'month') return MONTHS[a.getMonth()];
  if (mode === 'year') return String(a.getFullYear());
  return 'all time';
}
const inR = (r, rg) => r.date >= rg.start && r.date <= rg.end;
function daysElapsed(rg){
  const s = parse(rg.start), e = parse(rg.end), t = parse(iso(today));
  const end = (t >= s && t <= e) ? t : e;
  return Math.max(1, Math.round((end - s) / 864e5) + 1);
}
function monthsBetween(start, end){
  const out = [], s = parse(start), e = parse(end);
  for (let d = new Date(s.getFullYear(), s.getMonth(), 1); d <= e; d.setMonth(d.getMonth() + 1)) out.push(new Date(d));
  return out;
}

/* Cumulative spending series for the pace chart */
function paceSeries(mode, a){
  const rg = range(mode, a);
  const rows = S.rows.filter(r => inR(r, rg) && isSpend(r));
  let buckets, labels, keyOf, cut;
  if (mode === 'month'){
    const n = dim(a.getFullYear(), a.getMonth());
    buckets = new Array(n).fill(0);
    labels = Array.from({length:n}, (_, i) => (i + 1) + ' ' + MON[a.getMonth()]);
    keyOf = r => Number(r.date.slice(8, 10)) - 1;
    cut = (today.getFullYear() === a.getFullYear() && today.getMonth() === a.getMonth()) ? today.getDate() : n;
  } else {
    const months = mode === 'year' ? Array.from({length:12}, (_, i) => new Date(a.getFullYear(), i, 1)) : monthsBetween(rg.start, rg.end);
    buckets = new Array(months.length).fill(0);
    labels = months.map(d => MON[d.getMonth()] + (mode === 'all' ? ' ' + String(d.getFullYear()).slice(2) : ''));
    const idx = new Map(months.map((d, i) => [d.getFullYear() + '-' + pad(d.getMonth() + 1), i]));
    keyOf = r => idx.get(r.date.slice(0, 7));
    cut = (mode === 'year' && today.getFullYear() === a.getFullYear()) ? today.getMonth() + 1 : months.length;
  }
  rows.forEach(r => { const k = keyOf(r); if (k !== undefined && k >= 0 && k < buckets.length) buckets[k] += r.amount; });
  let c = 0;
  const cum = buckets.map(v => (c += v));
  return {labels, values: cum.slice(0, Math.max(cut, 0))};
}

/* ================= Charts ================= */
function paceChart(el, cur, prev, curName, prevName){
  const W = 1000, H = 200;
  const n = Math.max(cur.labels.length, prev ? prev.values.length : 0, 2);
  const max = Math.max(1, ...cur.values, ...(prev ? prev.values : [])) * 1.1;
  const x = i => i / (n - 1) * W, y = v => H - v / max * H;
  const line = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const cv = cur.values;
  const area = cv.length > 1 ? line(cv) + ' L' + x(cv.length - 1) + ' ' + H + ' L0 ' + H + ' Z' : '';
  const ticks = [0, .25, .5, .75, 1].map(f => Math.round(f * (cur.labels.length - 1)));
  const last = cv.length ? cv[cv.length - 1] : 0;

  el.innerHTML =
    '<div class="readout" data-r></div>' +
    '<div class="plot">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
        [H/3, 2*H/3].map(g => '<line x1="0" x2="' + W + '" y1="' + g + '" y2="' + g + '" stroke="var(--rule)" vector-effect="non-scaling-stroke"/>').join('') +
        '<line x1="0" x2="' + W + '" y1="' + H + '" y2="' + H + '" stroke="var(--rule)" vector-effect="non-scaling-stroke"/>' +
        (prev && prev.values.length > 1 ? '<path d="' + line(prev.values) + '" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>' : '') +
        (area ? '<path d="' + area + '" fill="var(--ink)" fill-opacity=".05"/>' : '') +
        (cv.length > 1 ? '<path d="' + line(cv) + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' : '') +
      '</svg>' +
      '<span class="ylab" style="top:' + (y(max / 1.1) / H * 100) + '%">' + compact(max / 1.1) + '</span>' +
      '<div class="guide" hidden></div>' +
      (cv.length ? '<span class="pt" data-pt style="left:' + (x(cv.length - 1) / W * 100) + '%;top:' + (y(last) / H * 100) + '%"></span>' : '') +
    '</div>' +
    '<div class="xlabs">' + [...new Set(ticks)].map(i => '<span>' + esc(cur.labels[i]) + '</span>').join('') + '</div>';

  const ro = el.querySelector('[data-r]'), plot = el.querySelector('.plot'), guide = el.querySelector('.guide'), pt = el.querySelector('[data-pt]');
  const say = i => {
    const has = i < cv.length, pv = prev && i < prev.values.length ? prev.values[i] : null;
    ro.innerHTML = '<b>' + esc(cur.labels[i]) + '</b>&nbsp; ' + (has ? money(cv[i]) + ' spent so far' : 'No data yet') +
      (pv !== null ? '<span class="muted">, ' + esc(prevName) + ' ' + money(pv) + '</span>' : '');
  };
  const rest = () => {
    guide.hidden = true;
    if (pt && cv.length){ pt.style.left = (x(cv.length - 1) / W * 100) + '%'; pt.style.top = (y(last) / H * 100) + '%'; }
    ro.innerHTML = '<b>' + money(last) + '</b> spent in ' + esc(curName) +
      (prev && prev.values.length ? '<span class="muted">, ' + esc(prevName) + ' ' + money(prev.values[Math.min(cv.length, prev.values.length) - 1] || 0) + ' by the same point</span>' : '');
  };
  plot.addEventListener('pointermove', e => {
    const rect = plot.getBoundingClientRect();
    const i = Math.max(0, Math.min(cur.labels.length - 1, Math.round((e.clientX - rect.left) / rect.width * (n - 1))));
    guide.hidden = false; guide.style.left = (x(i) / W * 100) + '%';
    if (pt && i < cv.length){ pt.style.left = (x(i) / W * 100) + '%'; pt.style.top = (y(cv[i]) / H * 100) + '%'; }
    say(i);
  });
  plot.addEventListener('pointerleave', rest);
  rest();
}

function monthBars(el, months, focusKey){
  const max = Math.max(1, ...months.map(m => Math.max(m.inn, m.out)));
  el.innerHTML =
    '<div class="readout" data-r></div>' +
    '<div class="mbars">' + months.map((m, i) =>
      '<div class="mb' + (focusKey && m.key !== focusKey ? ' dim' : '') + '" data-i="' + i + '">' +
        '<div class="mb-bars"><span class="mb-in" style="height:' + (m.inn / max * 100) + '%"></span><span class="mb-out" style="height:' + (m.out / max * 100) + '%"></span></div>' +
      '</div>').join('') + '</div>' +
    '<div class="mlabs">' + months.map(m => '<span>' + esc(m.label) + '</span>').join('') + '</div>';
  const ro = el.querySelector('[data-r]');
  const say = m => { ro.innerHTML = '<b>' + esc(m.full) + '</b>&nbsp; in ' + money(m.inn) + ', out ' + money(m.out) +
    '<span class="muted">, ' + (m.inn - m.out >= 0 ? 'saved ' : 'overspent ') + money(Math.abs(m.inn - m.out)) + '</span>'; };
  const def = months.find(m => m.key === focusKey) || months[months.length - 1];
  el.querySelectorAll('.mb').forEach(b => {
    b.addEventListener('pointerenter', () => say(months[b.dataset.i]));
    b.addEventListener('click', () => say(months[b.dataset.i]));
  });
  el.querySelector('.mbars').addEventListener('pointerleave', () => say(def));
  say(def);
}

function donut(el, items, total){
  const R = 62, C = 2 * Math.PI * R, gap = items.length > 1 ? 3 : 0;
  const ops = [1, .72, .5, .34, .22, .13];
  let off = 0;
  const segs = items.map((it, i) => {
    const len = Math.max(0, it.value / total * C - gap);
    const s = '<circle cx="85" cy="85" r="' + R + '" fill="none" stroke="var(--ink)" stroke-opacity="' + ops[i] + '" stroke-width="16" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) + '"/>';
    off += it.value / total * C;
    return s;
  }).join('');
  el.innerHTML = '<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 170 170" aria-hidden="true">' +
    '<circle cx="85" cy="85" r="' + R + '" fill="none" stroke="var(--sunk)" stroke-width="16"/>' + segs + '</svg>' +
    '<div class="c"><b>' + compact(total) + '</b><span>spent</span></div></div>' +
    '<div class="dlegend">' + items.map((it, i) =>
      '<div class="dl"><span class="sw" style="opacity:' + ops[i] + '"></span><span class="n">' + esc(it.name) + '</span><span>' + money(it.value) + '</span><span class="p">' + Math.round(it.value / total * 100) + '%</span></div>'
    ).join('') + '</div></div>';
}

/* ================= Shared pieces ================= */
function groupSpend(rows, keyFn, nameFn, iconFn){
  const m = new Map();
  rows.forEach(r => {
    const k = keyFn(r);
    if (!m.has(k)) m.set(k, {name: nameFn(r), icon: iconFn ? iconFn(r) : '', value: 0, count: 0});
    const o = m.get(k); o.value += r.amount; o.count++;
    if (!o.icon && iconFn) o.icon = iconFn(r);
  });
  return [...m.values()].sort((a, b) => b.value - a.value);
}

function hlist(items, total, withBar = true){
  const max = items.length ? items[0].value : 1;
  return '<div class="hlist">' + items.map(it =>
    '<div class="hi"><span class="ico">' + esc(it.icon || '·') + '</span>' +
    '<span class="n">' + esc(it.name) + '</span>' +
    '<span class="a">' + money(it.value) + '<small>' + Math.round(it.value / total * 100) + '%</small></span>' +
    (withBar ? '<div class="bar"><span style="width:' + (it.value / max * 100) + '%"></span></div>' : '') +
    '</div>').join('') + '</div>';
}

function txRow(r, withDate){
  const kind = (isLent(r) || isRepaid(r)) ? 'lend' : r.type === 'Credit' ? 'in' : 'out';
  const sign = r.type === 'Credit' ? '+' : '−';
  const sub = [withDate ? dayName(r.date) : '', r.remarks, r.modeName, withDate ? '' : r.time].filter(Boolean).map(s => '<span>' + esc(s) + '</span>').join('');
  return '<div class="tx"><span class="ico">' + esc(r.icon || '·') + '</span>' +
    '<div style="min-width:0"><div class="tx-title">' + esc(r.cat) + (r.person ? '<span class="pill">' + esc(r.person) + '</span>' : '') + '</div>' +
    '<div class="tx-sub">' + sub + '</div></div>' +
    '<div class="tx-amt ' + kind + '">' + sign + '₹' + nf.format(r2(r.amount)) + '</div></div>';
}

const sortDesc = rows => rows.slice().sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
function dayName(s){ const d = parse(s); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()] + (d.getFullYear() !== today.getFullYear() ? ' ' + d.getFullYear() : ''); }

function emptyApp(){
  return '<div class="empty-hero"><h2>No entries yet</h2><p>Log your first expense with the iPhone Shortcut, or add one here. Everything shows up the moment it lands in your sheet.</p>' +
    '<button class="primary" type="button" onclick="openSheet()">Add entry</button></div>';
}

/* ================= Pages ================= */
function vOverview(){
  if (!S.rows.length) return emptyApp();
  const rg = range(), rows = S.rows.filter(r => inR(r, rg));
  const inn = sum(rows.filter(isIncome)), out = sum(rows.filter(isSpend)), net = inn - out;
  const lentNow = owedTotal();
  const heroLabel = S.mode === 'all' ? 'Net across all time' : 'Net for ' + shortLabel();
  const heroNum = '<span class="cur">' + (net < 0 ? '−' : net > 0 ? '+' : '') + '₹</span>' + nf.format(Math.abs(r2(net)));

  let note = '';
  const cur = paceSeries(S.mode, S.anchor);
  let prev = null;
  if (S.mode !== 'all'){
    prev = paceSeries(S.mode, prevAnchor());
    if (!prev.values.some(v => v > 0)) prev = null;
    const i = cur.values.length - 1, pv = prev ? prev.values[Math.min(i, prev.values.length - 1)] : 0;
    if (i >= 0 && pv > 0){
      const pct = Math.round((cur.values[i] - pv) / pv * 100);
      const when = (S.mode === 'month' && cur.values.length < cur.labels.length) || (S.mode === 'year' && cur.values.length < 12) ? ' at this point' : '';
      note = pct === 0 ? 'Spending is level with ' + shortLabel(S.mode, prevAnchor()) + when + '.'
        : 'Spending is ' + Math.abs(pct) + '% ' + (pct < 0 ? 'lower' : 'higher') + ' than ' + shortLabel(S.mode, prevAnchor()) + when + '.';
    }
  }

  const cats = groupSpend(rows.filter(isSpend), r => r.ckey, r => r.cat, r => r.icon);
  const recent = sortDesc(rows).slice(0, 6);

  return '<section>' +
      '<div class="hero-label">' + heroLabel + '</div>' +
      '<div class="hero-num' + (net > 0 ? ' pos' : '') + '">' + heroNum + '</div>' +
      '<div class="figs">' +
        '<div class="fig"><div class="k"><span class="dot in"></span>Money in</div><div class="v">' + money(inn) + '</div></div>' +
        '<div class="fig"><div class="k"><span class="dot"></span>Money out</div><div class="v">' + money(out) + '</div></div>' +
        '<div class="fig"><div class="k"><span class="dot lend"></span>Owed to you</div><div class="v">' + money(lentNow) + '</div></div>' +
      '</div>' +
      (note ? '<p class="note">' + esc(note) + '</p>' : '') +
    '</section>' +
    '<section class="sec"><div class="sec-head"><h2>Spending pace</h2>' +
      '<div class="legend"><span><i></i>' + esc(S.mode === 'all' ? 'Spent' : shortLabel()) + '</span>' + (prev ? '<span><i class="dash"></i>' + esc(shortLabel(S.mode, prevAnchor())) + '</span>' : '') + '</div></div>' +
      '<div class="chart" id="pace"></div></section>' +
    '<div class="grid2 sec">' +
      '<section><div class="sec-head"><h2>Where it went</h2><button class="link" type="button" data-go="analytics">Analytics</button></div>' +
        (cats.length ? hlist(cats.slice(0, 5), out) : '<p class="empty">No spending in ' + esc(shortLabel()) + '.</p>') + '</section>' +
      '<section><div class="sec-head"><h2>Recent</h2><button class="link" type="button" data-go="activity">See all</button></div>' +
        (recent.length ? recent.map(r => txRow(r, true)).join('') : '<p class="empty">No entries in ' + esc(shortLabel()) + '.</p>') + '</section>' +
    '</div>';
}
function afterOverview(){
  const el = $('#pace'); if (!el) return;
  const cur = paceSeries(S.mode, S.anchor);
  let prev = S.mode !== 'all' ? paceSeries(S.mode, prevAnchor()) : null;
  if (prev && !prev.values.some(v => v > 0)) prev = null;
  paceChart(el, cur, prev, shortLabel(), shortLabel(S.mode, prevAnchor()));
}

function vAnalytics(){
  if (!S.rows.length) return emptyApp();
  const rg = range(), rows = S.rows.filter(r => inR(r, rg));
  const spend = rows.filter(isSpend), inn = sum(rows.filter(isIncome)), out = sum(spend);
  const days = daysElapsed(rg);
  const rate = inn > 0 ? Math.round((inn - out) / inn * 100) + '%' : '—';
  const big = spend.slice().sort((a, b) => b.amount - a.amount)[0];
  const spendDays = new Set(spend.map(r => r.date)).size;
  const noSpend = Math.max(0, days - spendDays);

  const cats = groupSpend(spend, r => r.ckey, r => r.cat, r => r.icon);
  const top = cats.slice(0, 5);
  if (cats.length > 5) top.push({name:'Everything else', value: cats.slice(5).reduce((s, c) => s + c.value, 0)});
  const modes = groupSpend(spend, r => r.modeName.toLowerCase() || 'unknown', r => r.modeName || 'Unknown', r => iconOf(r.mode));

  const wd = new Array(7).fill(0);
  spend.forEach(r => { wd[(parse(r.date).getDay() + 6) % 7] += r.amount; });
  const wmax = Math.max(1, ...wd), wtop = wd.indexOf(Math.max(...wd));

  return '<div class="stats">' +
      '<div class="stat"><div class="k">Savings rate</div><div class="v">' + rate + '</div><div class="s">' + (inn > 0 ? 'of income kept' : 'No income logged') + '</div></div>' +
      '<div class="stat"><div class="k">Daily average</div><div class="v">' + money(Math.round(out / days)) + '</div><div class="s">over ' + plural(days, 'day', 'days') + '</div></div>' +
      '<div class="stat"><div class="k">Biggest expense</div><div class="v">' + (big ? money(big.amount) : '—') + '</div><div class="s">' + (big ? esc(big.cat) + ', ' + dayName(big.date) : 'Nothing spent') + '</div></div>' +
      '<div class="stat"><div class="k">No-spend days</div><div class="v">' + noSpend + '</div><div class="s">of ' + plural(days, 'day', 'days') + '</div></div>' +
    '</div>' +
    '<section class="sec"><div class="sec-head"><h2>Income and spending</h2><div class="legend"><span><i class="sq in"></i>In</span><span><i class="sq"></i>Out</span></div></div>' +
      '<div class="chart" id="months"></div></section>' +
    '<div class="grid2 sec">' +
      '<section><div class="sec-head"><h2>By category</h2><span class="meta">' + plural(cats.length, 'category', 'categories') + '</span></div>' +
        (top.length ? '<div id="donut"></div>' : '<p class="empty">No spending in ' + esc(shortLabel()) + '.</p>') + '</section>' +
      '<section><div class="sec-head"><h2>By payment mode</h2></div>' +
        (modes.length ? hlist(modes, out) : '<p class="empty">No spending in ' + esc(shortLabel()) + '.</p>') + '</section>' +
    '</div>' +
    '<section class="sec"><div class="sec-head"><h2>By day of week</h2>' + (out ? '<span class="meta">Most on ' + WD[wtop] + 's</span>' : '') + '</div>' +
      '<div class="wbars">' + wd.map((v, i) => '<div class="wb' + (out && i === wtop ? ' top' : '') + '" title="' + WD[i] + ': ' + money(v) + '">' +
        '<span style="height:' + Math.max(v ? 4 : 2, v / wmax * 100) + '%"></span><small>' + WD[i] + '</small></div>').join('') + '</div></section>';
}
function afterAnalytics(){
  const rg = range(), rows = S.rows.filter(r => inR(r, rg)), spend = rows.filter(isSpend), out = sum(spend);
  const cats = groupSpend(spend, r => r.ckey, r => r.cat, r => r.icon);
  const top = cats.slice(0, 5);
  if (cats.length > 5) top.push({name:'Everything else', value: cats.slice(5).reduce((s, c) => s + c.value, 0)});
  if ($('#donut')) donut($('#donut'), top, out);

  let months, focus = null;
  if (S.mode === 'month'){
    months = Array.from({length:6}, (_, i) => new Date(S.anchor.getFullYear(), S.anchor.getMonth() - 5 + i, 1));
    focus = S.anchor.getFullYear() + '-' + pad(S.anchor.getMonth() + 1);
  } else if (S.mode === 'year'){
    months = Array.from({length:12}, (_, i) => new Date(S.anchor.getFullYear(), i, 1));
  } else {
    const rga = range('all'); months = monthsBetween(rga.start, rga.end).slice(-24);
  }
  const data = months.map(d => {
    const k = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    const rs = S.rows.filter(r => r.date.slice(0, 7) === k);
    return {key:k, label: MON[d.getMonth()], full: MONTHS[d.getMonth()] + ' ' + d.getFullYear(), inn: sum(rs.filter(isIncome)), out: sum(rs.filter(isSpend))};
  });
  monthBars($('#months'), data, focus);
}

function people(){
  const m = new Map();
  S.rows.forEach(r => {
    if (!isLent(r) && !isRepaid(r)) return;
    const name = r.person || 'No name', k = name.toLowerCase();
    if (!m.has(k)) m.set(k, {key:k, name, lent:0, rep:0, rows:[], last:r.date});
    const o = m.get(k);
    if (isLent(r)) o.lent += r.amount; else o.rep += r.amount;
    o.rows.push(r); if (r.date > o.last) o.last = r.date;
  });
  return [...m.values()].map(o => Object.assign(o, {due: r2(o.lent - o.rep)}));
}
const owedTotal = () => people().reduce((s, p) => s + Math.max(0, p.due), 0);

function vLending(){
  const ps = people();
  if (!ps.length) return '<div class="empty-hero"><h2>Nobody owes you anything</h2><p>When you lend money, add it as <b>Lent</b> with the person\'s name. When they pay you back, add it as <b>Got back</b>. The balance for each person shows up here.</p>' +
    '<button class="primary" type="button" onclick="openSheet(\'lent\')">Record a loan</button></div>';
  const open = ps.filter(p => p.due > 0).sort((a, b) => b.due - a.due);
  const done = ps.filter(p => p.due <= 0).sort((a, b) => b.last.localeCompare(a.last));
  const owed = open.reduce((s, p) => s + p.due, 0);
  const lentAll = ps.reduce((s, p) => s + p.lent, 0), repAll = ps.reduce((s, p) => s + p.rep, 0);

  const card = p => {
    const pct = p.lent ? Math.min(100, p.rep / p.lent * 100) : 100;
    const isOpen = S.open.has(p.key);
    return '<div class="person"><button class="person-btn" type="button" data-person="' + esc(p.key) + '" aria-expanded="' + isOpen + '">' +
      '<span class="avatar">' + esc(initials(p.name)) + '</span>' +
      '<span><span class="n">' + esc(p.name) + '</span><span class="s"> &nbsp;Lent ' + money(p.lent) + ', repaid ' + money(p.rep) + '</span>' +
        '<div class="progress"><span style="width:' + pct + '%"></span></div></span>' +
      '<span class="owe' + (p.due > 0 ? ' lend' : '') + '">' + (p.due > 0 ? money(p.due) + '<small>owes you</small>' : p.due === 0 ? 'Settled<small>' + dayName(p.last) + '</small>' : money(-p.due) + '<small>overpaid</small>') + '</span>' +
      '</button>' +
      (isOpen ? '<div class="person-hist">' + sortDesc(p.rows).map(r => txRow(r, true)).join('') + '</div>' : '') + '</div>';
  };

  return '<section>' +
      '<div class="hero-label">Owed to you</div>' +
      '<div class="hero-num"><span class="cur">₹</span>' + nf.format(r2(owed)) + '</div>' +
      '<div class="figs">' +
        '<div class="fig"><div class="k">People</div><div class="v">' + open.length + '</div></div>' +
        '<div class="fig"><div class="k">Lent in total</div><div class="v">' + money(lentAll) + '</div></div>' +
        '<div class="fig"><div class="k">Paid back</div><div class="v">' + money(repAll) + '</div></div>' +
      '</div></section>' +
    '<section class="sec"><div class="sec-head"><h2>Outstanding</h2><span class="meta">All time</span></div>' +
      (open.length ? open.map(card).join('') : '<p class="empty">Everyone has paid you back.</p>') + '</section>' +
    (done.length ? '<section class="sec"><div class="sec-head"><h2>Settled</h2></div>' + done.map(card).join('') + '</section>' : '');
}

function vActivity(){
  if (!S.rows.length) return emptyApp();
  const rg = range();
  const q = S.q.trim().toLowerCase();
  let rows = S.rows.filter(r => inR(r, rg));
  if (S.filter === 'out') rows = rows.filter(isSpend);
  if (S.filter === 'in') rows = rows.filter(isIncome);
  if (S.filter === 'lend') rows = rows.filter(r => isLent(r) || isRepaid(r));
  if (q) rows = rows.filter(r => [r.cat, r.remarks, r.modeName, r.person, String(r.amount)].join(' ').toLowerCase().includes(q));

  const days = new Map();
  sortDesc(rows).forEach(r => { if (!days.has(r.date)) days.set(r.date, []); days.get(r.date).push(r); });
  const f = (id, name) => '<button type="button" class="chip" data-filter="' + id + '" aria-pressed="' + (S.filter === id) + '">' + name + '</button>';

  return '<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search notes, categories, people, amounts" value="' + esc(S.q) + '" aria-label="Search entries">' +
      '<div class="chips">' + f('all','All') + f('out','Spent') + f('in','Received') + f('lend','Lending') + '</div></div>' +
    '<p class="muted" style="font-size:13px;margin:14px 0 0">' + plural(rows.length, 'entry', 'entries') + ' in ' + esc(label()) + '</p>' +
    (rows.length ? [...days.entries()].map(([d, rs]) => {
      const net = sum(rs.filter(r => r.type === 'Credit')) - sum(rs.filter(r => r.type === 'Debit'));
      return '<div class="day"><div class="day-h"><b>' + dayName(d) + '</b><span>' + signed(net) + '</span></div>' + rs.map(txRow).join('') + '</div>';
    }).join('') : '<p class="empty">' + (q || S.filter !== 'all' ? 'Nothing matches. Try a different search or filter.' : 'No entries in ' + esc(label()) + '.') + '</p>');
}

const VIEWS = {overview:[vOverview, afterOverview], analytics:[vAnalytics, afterAnalytics], lending:[vLending, null], activity:[vActivity, null]};

/* ================= Render ================= */
function navHTML(){
  return PAGES.map(p => '<button type="button" data-page="' + p.id + '"' + (S.page === p.id ? ' aria-current="page"' : '') + '>' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + p.icon + '</svg>' +
    '<span>' + p.name + '</span></button>').join('');
}
function render(){
  $('#nav').innerHTML = navHTML();
  $('#tabbar').innerHTML = navHTML();
  $('#title').textContent = PAGES.find(p => p.id === S.page).name;
  $('#periodCtl').hidden = S.page === 'lending';
  $('#plabel').textContent = label();
  const arrows = S.mode !== 'all';
  $('#prev').disabled = !arrows; $('#next').disabled = !arrows;
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === S.mode)));
  if (!S.loaded) return;
  const [v, after] = VIEWS[S.page];
  $('#view').innerHTML = v();
  if (after && S.rows.length) after();
}

function go(page){ S.page = page; render(); window.scrollTo({top:0}); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-page],[data-go],[data-filter],[data-person],[data-m]');
  if (!t) return;
  if (t.dataset.page) go(t.dataset.page);
  else if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.filter){ S.filter = t.dataset.filter; render(); }
  else if (t.dataset.person){ const k = t.dataset.person; S.open.has(k) ? S.open.delete(k) : S.open.add(k); render(); }
  else if (t.dataset.m){ S.mode = t.dataset.m; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search'){
    S.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const s = $('#search'); s.focus(); try { s.setSelectionRange(pos, pos); } catch (_) {}
  }
});
function shift(dir){
  const a = S.anchor;
  S.anchor = S.mode === 'month' ? new Date(a.getFullYear(), a.getMonth() + dir, 1) : new Date(a.getFullYear() + dir, a.getMonth(), 1);
  render();
}
$('#prev').addEventListener('click', () => shift(-1));
$('#next').addEventListener('click', () => shift(1));

/* ================= Data ================= */
function load(){
  google.script.run
    .withSuccessHandler(data => {
      S.rows = (data || []).map(prep);
      S.loaded = true;
      $('#err').hidden = true;
      $('#synced').textContent = 'Synced ' + new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
      render();
    })
    .withFailureHandler(e => {
      S.loaded = true;
      $('#err').hidden = false;
      $('#err').textContent = 'Couldn\'t read your Transactions sheet: ' + (e && e.message ? e.message : e) + '. Check the sheet name and the key in the URL, then reload.';
      $('#view').innerHTML = '';
    })
    .getData(KEY);
}

/* ================= Add entry ================= */
function catsFor(kind){
  const base = kind === 'received' ? CATS_IN : CATS_OUT;
  const seen = new Set(base.map(c => clean(c).toLowerCase()));
  const want = kind === 'received' ? isIncome : isSpend;
  S.rows.filter(want).forEach(r => { if (!seen.has(r.ckey)){ seen.add(r.ckey); base.push(r.category); } });
  return base;
}
function chipsHTML(list, selected, attr){
  return list.map(c => '<button type="button" class="chip" ' + attr + '="' + esc(c) + '" aria-pressed="' + (c === selected) + '">' + esc(c) + '</button>').join('');
}
function paintSheet(){
  document.querySelectorAll('#kindSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === S.kind)));
  const lending = S.kind === 'lent' || S.kind === 'back';
  $('#fCatWrap').hidden = lending;
  $('#fPersonWrap').hidden = !lending;
  if (!lending) $('#fCats').innerHTML = chipsHTML(catsFor(S.kind), S.cat, 'data-cat');
  $('#fModes').innerHTML = chipsHTML(MODES, S.mode2, 'data-mode');
  $('#fModeLabel').textContent = S.kind === 'spent' || S.kind === 'lent' ? 'Paid with' : 'Received via';
  $('#people').innerHTML = people().map(p => '<option value="' + esc(p.name) + '">').join('');
}
function openSheet(kind){
  S.kind = kind || 'spent'; S.cat = null;
  $('#fAmt').value = ''; $('#fNote').value = ''; $('#fPerson').value = ''; $('#fErr').textContent = '';
  const now = new Date();
  $('#fDate').value = iso(now);
  $('#fTime').value = pad(now.getHours()) + ':' + pad(now.getMinutes());
  paintSheet();
  $('#sheet').showModal();
  setTimeout(() => $('#fAmt').focus(), 50);
}
$('#addBtn').addEventListener('click', () => openSheet(S.page === 'lending' ? 'lent' : 'spent'));
$('#closeSheet').addEventListener('click', () => $('#sheet').close());
$('#sheet').addEventListener('click', e => {
  if (e.target === $('#sheet')) { $('#sheet').close(); return; }
  const k = e.target.closest('[data-k]'), c = e.target.closest('[data-cat]'), m = e.target.closest('[data-mode]');
  if (k){ S.kind = k.dataset.k; S.cat = null; paintSheet(); }
  if (c){ S.cat = c.dataset.cat; paintSheet(); }
  if (m){ S.mode2 = m.dataset.mode; paintSheet(); }
});
$('#fSave').addEventListener('click', () => {
  const amt = Number(String($('#fAmt').value).replace(/[^0-9.]/g, ''));
  const person = $('#fPerson').value.trim();
  const lending = S.kind === 'lent' || S.kind === 'back';
  const errs = [];
  if (!(amt > 0)) errs.push('Enter an amount above zero.');
  if (!lending && !S.cat) errs.push('Pick a category.');
  if (lending && !person) errs.push('Add the person\'s name.');
  if (!$('#fDate').value) errs.push('Pick a date.');
  if (errs.length){ $('#fErr').textContent = errs.join(' '); return; }

  const payload = {
    amount: amt,
    type: (S.kind === 'received' || S.kind === 'back') ? 'Credit' : 'Debit',
    category: S.kind === 'lent' ? 'Lent 🤝' : S.kind === 'back' ? 'Repaid 💸' : S.cat,
    paymentMode: S.mode2, remarks: $('#fNote').value.trim(), person: lending ? person : '',
    date: $('#fDate').value, time: $('#fTime').value
  };
  const btn = $('#fSave'); btn.disabled = true; btn.textContent = 'Saving…';
  google.script.run
    .withSuccessHandler(() => {
      btn.disabled = false; btn.textContent = 'Save entry';
      $('#sheet').close(); toast('Entry saved'); load();
    })
    .withFailureHandler(e => {
      btn.disabled = false; btn.textContent = 'Save entry';
      $('#fErr').textContent = 'Couldn\'t save: ' + (e && e.message ? e.message : e);
    })
    .addEntry(KEY, payload);
});
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2200);
}

render();
load();
</script>
</body>
</html>
